# dfkbl.toml - settings template (the game writes/reads dfkbl.toml next to the exe).
# Saves are diff-only: default-equal cvars are omitted. d3d12_submit_on_primary_buffer_end
# = false is the validated slowdown fix and the SDK default, so its line missing from a
# written file means the fix is active. The explicit line below pins it for stale-SDK safety.
d3d12_submit_on_primary_buffer_end = false
window_width = 1280
window_height = 720
fullscreen = false
gpu_plugin = "xenos"
gpu_allow_invalid_fetch_constants = true
mnk_mode = true
keybind_a = "Z"
keybind_b = "X"
keybind_x = "C"
keybind_y = "A"
keybind_left_shoulder = "Q"
keybind_right_shoulder = "W"
keybind_lstick_up = "Up"
keybind_lstick_down = "Down"
keybind_lstick_left = "Left"
keybind_lstick_right = "Right"
keybind_lstick_press = "U"
keybind_rstick_up = "Numpad8"
keybind_rstick_down = "Numpad5"
keybind_rstick_left = "Numpad4"
keybind_rstick_right = "Numpad6"
keybind_rstick_press = "O"
keybind_dpad_up = "I"
keybind_dpad_down = "K"
keybind_dpad_left = "J"
keybind_dpad_right = "L"
keybind_back = "Tab"
keybind_start = "1"
